<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura proposta de balanceamento e failover</title>
  <desc id="desc">Clientes VPN entram no Nginx frontend, que balanceia duas APIs e usa uma instância Backup como reserva; as APIs compartilham o banco PostgreSQL privado.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#50729f"/></marker><linearGradient id="h" x1="0" x2="1"><stop stop-color="#244a8e"/><stop offset="1" stop-color="#397bc2"/></linearGradient></defs>
  <rect width="1440" height="760" rx="28" fill="#f4f7fb"/><path d="M0 0h1440v112H0z" fill="url(#h)"/>
  <text x="52" y="52" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Dado Seguro · arquitetura proposta</text>
  <text x="52" y="84" fill="#dce9fb" font-family="Arial,sans-serif" font-size="17">Alvo de balanceamento; a ativação depende das pendências de rede e armazenamento</text>
  <rect x="44" y="212" width="205" height="176" rx="20" fill="#fff" stroke="#bdd0e5" stroke-width="2"/>
  <text x="146" y="257" text-anchor="middle" fill="#24476f" font-family="Arial,sans-serif" font-size="20" font-weight="700">Clientes</text><text x="146" y="291" text-anchor="middle" fill="#5e7086" font-family="Arial,sans-serif" font-size="16">somente via VPN</text><text x="146" y="323" text-anchor="middle" fill="#5e7086" font-family="Arial,sans-serif" font-size="16">HTTP no túnel</text><text x="146" y="355" text-anchor="middle" fill="#5e7086" font-family="Arial,sans-serif" font-size="16">TLS por domínio</text>
  <rect x="315" y="180" width="270" height="238" rx="20" fill="#fff" stroke="#4f91d0" stroke-width="3"/>
  <text x="450" y="220" text-anchor="middle" fill="#24476f" font-family="Arial,sans-serif" font-size="20" font-weight="700">Frontend · EC2</text><rect x="345" y="248" width="210" height="70" rx="13" fill="#e8f3ff"/><text x="450" y="278" text-anchor="middle" fill="#24476f" font-family="Arial,sans-serif" font-size="17" font-weight="700">OpenVPN</text><text x="450" y="301" text-anchor="middle" fill="#60728a" font-family="Arial,sans-serif" font-size="14">rota privada</text><rect x="345" y="333" width="210" height="60" rx="13" fill="#edf5ff"/><text x="450" y="370" text-anchor="middle" fill="#24476f" font-family="Arial,sans-serif" font-size="17" font-weight="700">Nginx · upstream</text>
  <rect x="659" y="147" width="266" height="200" rx="20" fill="#fff" stroke="#57a888" stroke-width="3"/>
  <text x="792" y="187" text-anchor="middle" fill="#236b54" font-family="Arial,sans-serif" font-size="20" font-weight="700">Backend 1 · principal</text><text x="792" y="239" text-anchor="middle" fill="#354e67" font-family="Arial,sans-serif" font-size="17">Nginx → API Docker</text><text x="792" y="278" text-anchor="middle" fill="#354e67" font-family="Arial,sans-serif" font-size="17">sessões PostgreSQL</text><text x="792" y="316" text-anchor="middle" fill="#60728a" font-family="Arial,sans-serif" font-size="15">uploads ainda locais</text>
  <rect x="659" y="390" width="266" height="182" rx="20" fill="#fff" stroke="#57a888" stroke-width="3"/>
  <text x="792" y="430" text-anchor="middle" fill="#236b54" font-family="Arial,sans-serif" font-size="20" font-weight="700">Backend 2 · principal</text><text x="792" y="482" text-anchor="middle" fill="#354e67" font-family="Arial,sans-serif" font-size="17">Nginx → API Docker</text><text x="792" y="521" text-anchor="middle" fill="#354e67" font-family="Arial,sans-serif" font-size="17">sessões PostgreSQL</text><text x="792" y="550" text-anchor="middle" fill="#60728a" font-family="Arial,sans-serif" font-size="15">uploads ainda locais</text>
  <rect x="659" y="611" width="266" height="110" rx="20" fill="#fff" stroke="#d4a05b" stroke-width="3"/><text x="792" y="650" text-anchor="middle" fill="#805d2d" font-family="Arial,sans-serif" font-size="20" font-weight="700">Backup · standby</text><text x="792" y="684" text-anchor="middle" fill="#60728a" font-family="Arial,sans-serif" font-size="16">API só quando primários falharem</text>
  <rect x="1043" y="257" width="344" height="266" rx="20" fill="#fff" stroke="#7196bf" stroke-width="3"/>
  <text x="1215" y="298" text-anchor="middle" fill="#24476f" font-family="Arial,sans-serif" font-size="20" font-weight="700">Backend 1 · banco privado</text><rect x="1080" y="332" width="270" height="117" rx="14" fill="#eef6ff" stroke="#a7c0dd"/><text x="1215" y="374" text-anchor="middle" fill="#354e67" font-family="Arial,sans-serif" font-size="19" font-weight="700">PostgreSQL 16</text><text x="1215" y="407" text-anchor="middle" fill="#60728a" font-family="Arial,sans-serif" font-size="16">porta 5432 só entre SGs</text><text x="1215" y="431" text-anchor="middle" fill="#60728a" font-family="Arial,sans-serif" font-size="15">volume persistente</text>
  <path d="M249 300h58" stroke="#50729f" stroke-width="4" marker-end="url(#a)"/><path d="M585 320c34 0 37-73 69-73" fill="none" stroke="#50729f" stroke-width="4" marker-end="url(#a)"/><path d="M585 320c34 0 37 160 69 160" fill="none" stroke="#50729f" stroke-width="4" marker-end="url(#a)"/><path d="M585 320c34 0 37 346 69 346" fill="none" stroke="#d09a53" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#a)"/>
  <path d="M925 247h110" stroke="#50729f" stroke-width="4" marker-end="url(#a)"/><path d="M925 483h110" stroke="#50729f" stroke-width="4" marker-end="url(#a)"/><path d="M925 666c82 0 76-209 110-209" fill="none" stroke="#d09a53" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#a)"/>
</svg>
