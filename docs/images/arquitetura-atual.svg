  <text x="1174" y="252" fill="#55657b" font-family="Arial,sans-serif" font-size="16">Código copiado</text>
  <text x="1174" y="286" fill="#ad6630" font-family="Arial,sans-serif" font-size="15">API pendente</text>
  <rect x="1148" y="351" width="244" height="165" rx="20" fill="#fff" stroke="#d5a45e" stroke-width="2"/>
  <text x="1174" y="388" fill="#805d2d" font-family="Arial,sans-serif" font-size="20" font-weight="700">Servidor Backup</text>
  <text x="1174" y="424" fill="#55657b" font-family="Arial,sans-serif" font-size="16">Docker instalado</text>
  <text x="1174" y="450" fill="#55657b" font-family="Arial,sans-serif" font-size="16">Código copiado</text>
  <text x="1174" y="484" fill="#ad6630" font-family="Arial,sans-serif" font-size="15">API pendente</text>
  <path d="M260 231h46" stroke="#4f6f9e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M666 280h54" stroke="#4f6f9e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M908 336v18" stroke="#4f6f9e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1089 270h48" stroke="#b87c3d" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M1089 434h48" stroke="#b87c3d" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="48" y="570" width="1344" height="180" rx="20" fill="#fff" stroke="#d8e1ec"/>
  <text x="78" y="613" fill="#203b61" font-family="Arial,sans-serif" font-size="20" font-weight="700">Pendências para alta disponibilidade</text>
  <text x="78" y="652" fill="#53657c" font-family="Arial,sans-serif" font-size="17">• Permitir PostgreSQL somente pelos Security Groups internos autorizados.</text>
  <text x="78" y="684" fill="#53657c" font-family="Arial,sans-serif" font-size="17">• Distribuir segredos da aplicação por canal seguro e iniciar as duas APIs secundárias.</text>
  <text x="78" y="716" fill="#53657c" font-family="Arial,sans-serif" font-size="17">• Ativar upstream Nginx e definir armazenamento compartilhado para uploads.</text>
</svg>
