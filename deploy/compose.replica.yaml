# API para Backend 2 e Backup, conectada ao PostgreSQL privado da Backend 1.
# Use com: docker compose -f compose.replica.yaml up -d --build --wait
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=160
      DB_HOST: ${DADOSEGURO_DB_HOST:?Defina o IP privado do PostgreSQL}
      DB_PORT: "5432"
      DB_NAME: dadoseguro
      DB_USER: dadoseguro_app
      DB_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
    secrets:
      - db_password
      - admin_password
      - session_secret
    volumes:
      - uploads_data:/app/uploads
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  db_password:
    file: ../.db_password
  admin_password:
    file: ../.admin_password
  session_secret:
    file: ../.session_secret

volumes:
  uploads_data:
